<!DOCTYPE html>
<html lang="it" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beeload</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    .font-arian {
      font-family: 'Arian', 'Arian AMU', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen flex flex-col justify-between items-center p-6 antialiased transition-colors duration-300">

  <!-- Header / Brand -->
  <header class="w-full max-w-4xl flex justify-between items-center py-4">
    <div class="flex items-center gap-3">
      <!-- Immagine Logo Ufficiale -->
      <img src="logo.png" alt="Beeload Logo" class="h-10 w-auto object-contain" onerror="this.style.display='none'; document.getElementById('logo-fallback').style.display='block';">
      
      <!-- Fallback se il logo non è ancora stato caricato -->
      <div id="logo-fallback" class="hidden text-amber-500 font-bold text-2xl">🐝</div>

      <span class="font-arian font-bold text-2xl tracking-tight text-slate-900 dark:text-white">Beeload</span>
    </div>

    <!-- Controlli Header: Status & Theme Toggle -->
    <div class="flex items-center gap-3">
      <div class="hidden sm:flex items-center gap-2 px-3 py-1 bg-amber-500/10 border border-amber-500/20 rounded-full text-xs text-amber-600 dark:text-amber-400 font-medium">
        <span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
        System Update In Progress
      </div>

      <!-- Pulsante Switch Light / Dark Mode -->
      <button id="theme-toggle" class="p-2 rounded-xl bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-300 dark:hover:bg-slate-700 transition-colors" aria-label="Cambia tema">
        <!-- Icona Sole (Light Mode) -->
        <svg id="theme-toggle-light-icon" class="w-5 h-5 hidden" fill="currentColor" viewBox="0 0 20 20">
          <path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 100 2h1z" />
        </svg>
        <!-- Icona Luna (Dark Mode) -->
        <svg id="theme-toggle-dark-icon" class="w-5 h-5 hidden" fill="currentColor" viewBox="0 0 20 20">
          <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z" />
        </svg>
      </button>
    </div>
  </header>

  <!-- Main Content / Rotator -->
  <main class="w-full max-w-2xl text-center my-auto py-12">
    <div class="space-y-6">
      <h1 id="rotating-text" class="text-3xl md:text-5xl font-extrabold tracking-tight text-slate-900 dark:text-slate-100 min-h-[80px] flex items-center justify-center transition-opacity duration-500 opacity-100">
        <!-- Testo aggiornato dinamicamente via JS -->
      </h1>
      
      <p class="text-slate-600 dark:text-slate-400 text-sm md:text-base max-w-md mx-auto">
        Stiamo aggiornando le nostre infrastrutture. Torneremo online a breve.
      </p>

      <div class="pt-4">
        <a href="mailto:contact@beeload.it" class="inline-flex items-center justify-center px-6 py-3 text-sm font-semibold text-slate-950 bg-amber-400 hover:bg-amber-300 transition-colors rounded-xl shadow-lg shadow-amber-500/10">
          Contact Us
        </a>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="w-full max-w-4xl text-center py-6 text-xs text-slate-500 dark:text-slate-500 border-t border-slate-200 dark:border-slate-900">
    &copy; <script>document.write(new Date().getFullYear())</script> <span class="font-arian font-bold text-slate-700 dark:text-slate-400">Beeload</span>. All rights reserved.
  </footer>

  <!-- Script Gestione Tema & Rotatore Multilingua -->
  <script>
    // --- GESTIONE TEMA LIGHT/DARK ---
    const themeToggleBtn = document.getElementById('theme-toggle');
    const darkIcon = document.getElementById('theme-toggle-dark-icon');
    const lightIcon = document.getElementById('theme-toggle-light-icon');

    // Imposta tema iniziale in base a localStorage o preferenze di sistema
    if (localStorage.getItem('theme') === 'light' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: light)').matches)) {
      document.documentElement.classList.remove('dark');
      darkIcon.classList.remove('hidden');
    } else {
      document.documentElement.classList.add('dark');
      lightIcon.classList.remove('hidden');
    }

    // Toggle Tema al click
    themeToggleBtn.addEventListener('click', function() {
      lightIcon.classList.toggle('hidden');
      darkIcon.classList.toggle('hidden');

      if (document.documentElement.classList.contains('dark')) {
        document.documentElement.classList.remove('dark');
        localStorage.setItem('theme', 'light');
      } else {
        document.documentElement.classList.add('dark');
        localStorage.setItem('theme', 'dark');
      }
    });

    // --- ROTATORE TESTO MULTILINGUA ---
    const messages = [
      "Stiamo aggiornando i nostri sistemi.",
      "We are updating our systems.",
      "Estamos aggiornando nuestros sistemas.",
      "Nous mettons à jour nos systèmes.",
      "Wir aktualisieren unsere Systeme.",
      "Nossos sistemas estão sendo atualizados.",
      "Sistemlerimizi güncelliyoruz.",
      "Perbarui sistem kami sedang berlangsung."
    ];

    let currentIndex = 0;
    const textElement = document.getElementById("rotating-text");

    function updateText() {
      textElement.classList.add("opacity-0");
      setTimeout(() => {
        textElement.textContent = messages[currentIndex];
        textElement.classList.remove("opacity-0");
        currentIndex = (currentIndex + 1) % messages.length;
      }, 500);
    }

    updateText();
    setInterval(updateText, 3500);
  </script>
</body>
</html>
